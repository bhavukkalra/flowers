<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Flower</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fef6f5;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flower {
      position: relative;
      width: 100px;
      height: 100px;
      animation: spin 10s linear infinite;
    }

    .petal {
      position: absolute;
      width: 60px;
      height: 60px;
      background: pink;
      border-radius: 50%;
      opacity: 0.8;
      top: 20px;
      left: 20px;
      transform-origin: center;
    }

    .center {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 30px;
      height: 30px;
      background: yellow;
      border-radius: 50%;
      z-index: 10;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="flower" id="flower"></div>

  <script>
    const flower = document.getElementById("flower");

    // Add 6 petals
    for (let i = 0; i < 6; i++) {
      const petal = document.createElement("div");
      petal.className = "petal";
      petal.style.transform = `rotate(${i * 60}deg) translate(30px)`;
      flower.appendChild(petal);
    }

    const center = document.createElement("div");
    center.className = "center";
    flower.appendChild(center);
  </script>
</body>
</html>
