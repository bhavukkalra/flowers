<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Flower Field</title>
  <style>
    body {
      margin: 0;
      background: #fef6f5;
      overflow: hidden;
    }

    .flower {
      position: absolute;
      width: 120px; /* Bigger flower */
      height: 120px;
      animation: spin 6s linear infinite; /* Faster rotation */
    }

    .petal {
      position: absolute;
      width: 60px; /* Bigger petal */
      height: 60px;
      background: pink;
      border-radius: 50%;
      opacity: 0.8;
      top: 30px;
      left: 30px;
      transform-origin: center;
    }

    .center {
      position: absolute;
      top: 52px;
      left: 52px;
      width: 16px;
      height: 16px;
      background: yellow;
      border-radius: 50%;
      z-index: 10;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script>
    const flowerCount = 100; // Adjust to keep performance good with bigger flowers
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    for (let i = 0; i < flowerCount; i++) {
      const flower = document.createElement("div");
      flower.className = "flower";

      // Random position
      const x = Math.random() * screenWidth;
      const y = Math.random() * screenHeight;
      flower.style.left = `${x}px`;
      flower.style.top = `${y}px`;

      // Random animation speed (faster overall)
      const speed = 3 + Math.random() * 5;
      flower.style.animationDuration = `${speed}s`;

      // Add 6 petals
      for (let j = 0; j < 6; j++) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.transform = `rotate(${j * 60}deg) translate(30px)`; // Adjusted for size
        flower.appendChild(petal);
      }

      // Add center
      const center = document.createElement("div");
      center.className = "center";
      flower.appendChild(center);

      document.body.appendChild(flower);
    }
  </script>
</body>
</html>
